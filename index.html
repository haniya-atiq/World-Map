
<!DOCTYPE html>
<html>
<head>
    <title>Explore the World</title>
    <style>
        body {
            background-color: #f0fff0;
            font-family: Arial;
            text-align: center;
            margin: 30px;
        }
        h1 {
            color: #174a7e;
        }
        p {
            font-size: 18px;
        }
        img {
            border: 3px solid #176b45;
            border-radius: 10px;
        }
        a {
            color: #075e9b;
        }
    </style>
</head>
<body>

    <h1>Explore the World</h1>
    <p>Welcome to my interactive world map project!</p>
    <p>Click on Asia to explore its countries.</p>

<img src="worldmap.jpg" alt="World Map"
     width="800" usemap="#world">

<map name="world">
    <area shape="rect"
          coords="420,80,750,400"
          href="asia.html"
          alt="Asia"
          title="Explore Asia">
</map>

    <hr>
    <p>My HTML Project | World Geography</p>

</body>
</html>
